name: Auto Release on Merge

# リリースブランチ（release/vX.Y.Z）がmainにマージされたら自動的にリリース処理を実行
on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  auto-release:
    # PRがマージされ、かつブランチ名がrelease/vで始まる場合のみ実行
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version from branch name
        id: version
        run: |
          # ブランチ名からバージョンを抽出 (release/v1.0.11 → v1.0.11)
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          VERSION_TAG="${BRANCH_NAME#release/}"
          VERSION="${VERSION_TAG#v}"

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "📦 Release branch: $BRANCH_NAME"
          echo "🏷️ Version tag: $VERSION_TAG"
          echo "🔢 Version number: $VERSION"

      - name: Validate CHANGELOG entry
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "❌ Error: CHANGELOG.md missing version [$VERSION] section"
            echo "Please update CHANGELOG.md in the release branch"
            exit 1
          fi

          echo "✅ CHANGELOG.md has [$VERSION] section"

      - name: Create and push tag
        run: |
          VERSION_TAG="${{ steps.version.outputs.version_tag }}"

          # タグが既に存在する場合はスキップ
          if git rev-parse "$VERSION_TAG" >/dev/null 2>&1; then
            echo "⚠️ Tag $VERSION_TAG already exists. Skipping."
            exit 0
          fi

          # タグを作成
          git tag "$VERSION_TAG"

          # タグをプッシュ
          git push origin "$VERSION_TAG"

          echo "✅ Created and pushed tag $VERSION_TAG"

      - name: Extract changelog for release notes
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.version_tag }}"

          # CHANGELOG.mdから該当バージョンのセクションを抽出
          if grep -q "## \[$VERSION\]" CHANGELOG.md; then
            # バージョンセクションの開始行を見つける
            START_LINE=$(grep -n "## \[$VERSION\]" CHANGELOG.md | cut -d: -f1)
            # 次のバージョンセクションの開始行を見つける（または末尾）
            NEXT_LINE=$(tail -n +$((START_LINE + 1)) CHANGELOG.md | grep -n "^## \[" | head -1 | cut -d: -f1)

            if [ -n "$NEXT_LINE" ]; then
              # 次のセクションがある場合
              END_LINE=$((START_LINE + NEXT_LINE - 1))
              sed -n "${START_LINE},${END_LINE}p" CHANGELOG.md > changelog_section.md
            else
              # 最後のセクションの場合
              sed -n "${START_LINE},\$p" CHANGELOG.md > changelog_section.md
            fi

            # バージョン見出しを削除
            sed -i '1d' changelog_section.md

            # リンクセクションを削除
            sed -i '/^\[.*\]: http/d' changelog_section.md

            # 空行を整理
            sed -i '/^$/N;/^\n$/D' changelog_section.md

            # リリースノートを整形して作成
            cat > release_notes.md <<EOF
# 🎉 ${TAG} Release

UIRouting ${TAG} has been released.

## 📝 Changes

$(cat changelog_section.md)

## 📦 Installation

\`\`\`swift
dependencies: [
    .package(url: "https://github.com/no-problem-dev/swift-ui-routing.git", .upToNextMajor(from: "${VERSION}"))
]
\`\`\`

## 🔗 Links
- [CHANGELOG](https://github.com/no-problem-dev/swift-ui-routing/blob/main/CHANGELOG.md)
- [Documentation](https://no-problem-dev.github.io/swift-ui-routing/documentation/uirouting/)
EOF

            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "⚠️ CHANGELOG.md version $VERSION not found" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version_tag }}
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: ${{ steps.changelog.outputs.found != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate next version
        id: next_version
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # バージョンをMAJOR.MINOR.PATCHに分解
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # PATCHをインクリメント
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="$MAJOR.$MINOR.$NEXT_PATCH"
          NEXT_VERSION_TAG="v$NEXT_VERSION"
          NEXT_BRANCH="release/$NEXT_VERSION_TAG"

          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "next_version_tag=$NEXT_VERSION_TAG" >> $GITHUB_OUTPUT
          echo "next_branch=$NEXT_BRANCH" >> $GITHUB_OUTPUT

          echo "📈 Next version: $NEXT_VERSION"
          echo "🌿 Next release branch: $NEXT_BRANCH"

      - name: Delete old release branch if exists
        run: |
          NEXT_BRANCH="${{ steps.next_version.outputs.next_branch }}"

          # リモートブランチが存在する場合は削除
          if git ls-remote --heads origin "$NEXT_BRANCH" | grep -q "$NEXT_BRANCH"; then
            git push origin --delete "$NEXT_BRANCH"
            echo "🗑️ Deleted existing branch $NEXT_BRANCH"
          fi

      - name: Create next release branch
        run: |
          NEXT_BRANCH="${{ steps.next_version.outputs.next_branch }}"

          # mainブランチから新しいリリースブランチを作成
          git checkout -b "$NEXT_BRANCH"

          echo "✅ Created next release branch $NEXT_BRANCH"

      - name: Update CHANGELOG for next version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_TAG="${{ steps.version.outputs.version_tag }}"
          NEXT_VERSION="${{ steps.next_version.outputs.next_version }}"

          # 「未リリース」セクションが存在しない場合のみ追加
          if ! grep -q "## \[未リリース\]" CHANGELOG.md; then
            # 最初のバージョンセクションの前に挿入
            awk '
              /^## \[/ && !inserted {
                print "## [未リリース]"
                print ""
                print "なし"
                print ""
                inserted = 1
              }
              { print }
            ' CHANGELOG.md > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md

            echo "✅ Added [未リリース] section to CHANGELOG.md"
          else
            echo "ℹ️ CHANGELOG.md already has [未リリース] section"
          fi

          # 比較リンクを最新バージョンに更新
          sed -i "s|\[未リリース\]: .*|\[未リリース\]: https://github.com/no-problem-dev/swift-ui-routing/compare/$VERSION_TAG...HEAD|" CHANGELOG.md

          # 必ず変更を発生させるため、自動生成コメントを追加
          echo "" >> CHANGELOG.md
          echo "<!-- Auto-generated on $(date -u +%Y-%m-%dT%H:%M:%SZ) by release workflow -->" >> CHANGELOG.md

          echo "✅ Updated CHANGELOG.md"

      - name: Commit and push next release branch
        run: |
          NEXT_BRANCH="${{ steps.next_version.outputs.next_branch }}"
          NEXT_VERSION_TAG="${{ steps.next_version.outputs.next_version_tag }}"

          # 変更がある場合のみコミット
          if git diff --quiet CHANGELOG.md; then
            echo "ℹ️ No changes in CHANGELOG.md, skipping commit"
          else
            git add CHANGELOG.md
            git commit -m "chore: prepare for $NEXT_VERSION_TAG release"
            echo "✅ Committed changes"
          fi

          # ブランチをプッシュ
          git push origin "$NEXT_BRANCH"

          echo "✅ Pushed branch $NEXT_BRANCH"

      - name: Create draft PR for next release
        run: |
          NEXT_BRANCH="${{ steps.next_version.outputs.next_branch }}"
          NEXT_VERSION_TAG="${{ steps.next_version.outputs.next_version_tag }}"

          gh pr create \
            --draft \
            --title "Release $NEXT_VERSION_TAG" \
            --body "$(cat <<EOF
# 🚀 Release $NEXT_VERSION_TAG

Next release preparation branch.

## 📝 Development Flow

1. **Development**: Merge new features/fixes to this branch
2. **Update CHANGELOG**: Record changes in the [未リリース] section of \`CHANGELOG.md\`
3. **Release Preparation**: When all changes are complete, convert [未リリース] to [$NEXT_VERSION_TAG] section
4. **Execute Release**: Merge this PR

## ⚙️ Automation

When this PR is merged to main, the following will be automatically executed:
- ✅ Auto-create tag $NEXT_VERSION_TAG
- ✅ Auto-create GitHub Release
- ✅ Auto-create next release branch

## 📋 Pre-Release Checklist

- [ ] Convert [未リリース] to [$NEXT_VERSION_TAG] in CHANGELOG.md
- [ ] Add date (YYYY-MM-DD format)
- [ ] Update comparison link section
- [ ] All tests pass
- [ ] Documentation is up to date

---
🤖 This PR was auto-generated
EOF
          )" \
            --base main \
            --head "$NEXT_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          VERSION_TAG="${{ steps.version.outputs.version_tag }}"
          NEXT_VERSION_TAG="${{ steps.next_version.outputs.next_version_tag }}"
          NEXT_BRANCH="${{ steps.next_version.outputs.next_branch }}"

          echo "## 🎉 Release Process Complete"
          echo ""
          echo "### ✅ Executed Tasks"
          echo "- Created and pushed tag $VERSION_TAG"
          echo "- GitHub Release will be created"
          echo "- Created next release branch $NEXT_BRANCH"
          echo "- Created draft PR for next release"
          echo ""
          echo "### 🔗 Links"
          echo "- Release: https://github.com/${{ github.repository }}/releases/tag/$VERSION_TAG"
          echo "- Next PR: https://github.com/${{ github.repository }}/pulls"
