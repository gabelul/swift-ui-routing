name: Auto Release on Merge

# Run release automation when a release branch (release/vX.Y.Z) is merged into main
on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  auto-release:
    # Run only when a PR is merged and the branch starts with release/v
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version from branch name
        id: version
        run: |
          # Extract version from branch name (release/v1.0.11 → v1.0.11)
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          VERSION_TAG="${BRANCH_NAME#release/}"
          VERSION="${VERSION_TAG#v}"

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "📦 Release branch: $BRANCH_NAME"
          echo "🏷️ Version tag: $VERSION_TAG"
          echo "🔢 Version: $VERSION"

      - name: Validate CHANGELOG entry
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "❌ Error: Could not find version [$VERSION] section in CHANGELOG.md"
            echo "Please update CHANGELOG.md on the release branch"
            exit 1
          fi

          echo "✅ Found [$VERSION] section in CHANGELOG.md"

      - name: Create and push tag
        run: |
          VERSION_TAG="${{ steps.version.outputs.version_tag }}"

          # Skip if tag already exists
          if git rev-parse "$VERSION_TAG" >/dev/null 2>&1; then
            echo "⚠️ Tag $VERSION_TAG already exists. Skipping."
            exit 0
          fi

          # Create tag
          git tag "$VERSION_TAG"

          # Push tag
          git push origin "$VERSION_TAG"

          echo "✅ Created and pushed tag $VERSION_TAG"

      - name: Extract changelog for release notes
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.version_tag }}"

          # Extract the matching version section from CHANGELOG.md
          if grep -q "## \[$VERSION\]" CHANGELOG.md; then
            # Find the start line for the version section
            START_LINE=$(grep -n "## \[$VERSION\]" CHANGELOG.md | cut -d: -f1)
            # Find the next version section start line (or EOF)
            NEXT_LINE=$(tail -n +$((START_LINE + 1)) CHANGELOG.md | grep -n "^## \[" | head -1 | cut -d: -f1)

            if [ -n "$NEXT_LINE" ]; then
              # There is a next section
              END_LINE=$((START_LINE + NEXT_LINE - 1))
              sed -n "${START_LINE},${END_LINE}p" CHANGELOG.md > changelog_section.md
            else
              # This is the last section
              sed -n "${START_LINE},\$p" CHANGELOG.md > changelog_section.md
            fi

            # Remove the version header
            sed -i '1d' changelog_section.md

            # Remove link reference section
            sed -i '/^\[.*\]: http/d' changelog_section.md

            # Normalize blank lines
            sed -i '/^$/N;/^\n$/D' changelog_section.md

            # Build release notes markdown
            cat > release_notes.md <<EOF
          # 🎉 ${TAG} Release

          UIRouting ${TAG} has been released.

          ## 📝 Changes

          $(cat changelog_section.md)

          ## 📦 Installation

          \`\`\`swift
          dependencies: [
              .package(url: "https://github.com/no-problem-dev/swift-ui-routing.git", .upToNextMajor(from: "${VERSION}"))
          ]
          \`\`\`

          ## 🔗 Links
          - [Changelog](https://github.com/no-problem-dev/swift-ui-routing/blob/main/CHANGELOG.md)
          - [Docs](https://no-problem-dev.github.io/swift-ui-routing/documentation/uirouting/)
          EOF

            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "⚠️ Could not find version $VERSION in CHANGELOG.md" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version_tag }}
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: ${{ steps.changelog.outputs.found != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate next version
        id: next_version
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Split version into MAJOR.MINOR.PATCH
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Increment PATCH
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="$MAJOR.$MINOR.$NEXT_PATCH"
          NEXT_VERSION_TAG="v$NEXT_VERSION"
          NEXT_BRANCH="release/$NEXT_VERSION_TAG"

          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "next_version_tag=$NEXT_VERSION_TAG" >> $GITHUB_OUTPUT
          echo "next_branch=$NEXT_BRANCH" >> $GITHUB_OUTPUT

          echo "📈 Next version: $NEXT_VERSION"
          echo "🌿 Next release branch: $NEXT_BRANCH"

      - name: Delete old release branch if exists
        run: |
          NEXT_BRANCH="${{ steps.next_version.outputs.next_branch }}"

          # Delete remote branch if it already exists
          if git ls-remote --heads origin "$NEXT_BRANCH" | grep -q "$NEXT_BRANCH"; then
            git push origin --delete "$NEXT_BRANCH"
            echo "🗑️ Deleted existing branch $NEXT_BRANCH"
          fi

      - name: Create next release branch
        run: |
          NEXT_BRANCH="${{ steps.next_version.outputs.next_branch }}"

          # Create a new release branch from main
          git checkout -b "$NEXT_BRANCH"

          echo "✅ Created next release branch $NEXT_BRANCH"

      - name: Update CHANGELOG for next version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_TAG="${{ steps.version.outputs.version_tag }}"
          NEXT_VERSION="${{ steps.next_version.outputs.next_version }}"

          # Add an "Unreleased" section only if it doesn't exist
          if ! grep -q "## \[未リリース\]" CHANGELOG.md && ! grep -q "## \[Unreleased\]" CHANGELOG.md; then
            # Insert before the first version section
            awk '
              /^## \[/ && !inserted {
                print "## [Unreleased]"
                print ""
                print "None"
                print ""
                inserted = 1
              }
              { print }
            ' CHANGELOG.md > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md

            echo "✅ Added an \"Unreleased\" section to CHANGELOG.md"
          else
            echo "ℹ️ An \"Unreleased\" section already exists in CHANGELOG.md"
          fi

          # Update compare link to point at the latest version tag
          sed -i "s|\\[未リリース\\]: .*|\\[未リリース\\]: https://github.com/no-problem-dev/swift-ui-routing/compare/$VERSION_TAG...HEAD|" CHANGELOG.md || true
          sed -i "s|\\[Unreleased\\]: .*|\\[Unreleased\\]: https://github.com/no-problem-dev/swift-ui-routing/compare/$VERSION_TAG...HEAD|" CHANGELOG.md || true

          # Ensure the workflow produces a diff by appending a generated marker
          echo "" >> CHANGELOG.md
          echo "<!-- Auto-generated on $(date -u +%Y-%m-%dT%H:%M:%SZ) by release workflow -->" >> CHANGELOG.md

          echo "✅ Updated CHANGELOG.md"

      - name: Commit and push next release branch
        run: |
          NEXT_BRANCH="${{ steps.next_version.outputs.next_branch }}"
          NEXT_VERSION_TAG="${{ steps.next_version.outputs.next_version_tag }}"

          # Commit only when there are changes
          if git diff --quiet CHANGELOG.md; then
            echo "ℹ️ No changes in CHANGELOG.md; skipping commit"
          else
            git add CHANGELOG.md
            git commit -m "chore: prepare for $NEXT_VERSION_TAG release"
            echo "✅ Committed changes"
          fi

          # Push branch
          git push origin "$NEXT_BRANCH"

          echo "✅ Pushed branch $NEXT_BRANCH"

      - name: Create draft PR for next release
        run: |
          NEXT_BRANCH="${{ steps.next_version.outputs.next_branch }}"
          NEXT_VERSION_TAG="${{ steps.next_version.outputs.next_version_tag }}"

          gh pr create \
            --draft \
            --title "Release $NEXT_VERSION_TAG" \
            --body "$(cat <<EOF
          # 🚀 Release $NEXT_VERSION_TAG

          This is a branch for preparing the next release.

          ## 📝 Development flow

          1. **Develop**: merge new features/fixes into this branch
          2. **Update CHANGELOG**: record changes under the "Unreleased" section in \`CHANGELOG.md\`
          3. **Prepare release**: when ready, convert "Unreleased" into the "$NEXT_VERSION_TAG" section
          4. **Release**: merge this PR

          ## ⚙️ Automation

          When this PR is merged into main, the following will run automatically:
          - ✅ Create tag $NEXT_VERSION_TAG
          - ✅ Create a GitHub Release
          - ✅ Create the next release branch

          ## 📋 Pre-release checklist

          - [ ] Convert "Unreleased" into "[$NEXT_VERSION_TAG]" in CHANGELOG.md
          - [ ] Add the date (YYYY-MM-DD)
          - [ ] Update compare links
          - [ ] All tests passing
          - [ ] Docs up to date

          ---
          🤖 This PR was auto-generated
          EOF
          )" \
            --base main \
            --head "$NEXT_BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summary
        run: |
          VERSION_TAG="${{ steps.version.outputs.version_tag }}"
          NEXT_VERSION_TAG="${{ steps.next_version.outputs.next_version_tag }}"
          NEXT_BRANCH="${{ steps.next_version.outputs.next_branch }}"

          echo "## 🎉 Release automation complete"
          echo ""
          echo "### ✅ What ran"
          echo "- Created and pushed tag $VERSION_TAG"
          echo "- GitHub Release will be created"
          echo "- Created next release branch $NEXT_BRANCH"
          echo "- Created draft PR for the next release"
          echo ""
          echo "### 🔗 Links"
          echo "- Release: https://github.com/${{ github.repository }}/releases/tag/$VERSION_TAG"
          echo "- PRs: https://github.com/${{ github.repository }}/pulls"
